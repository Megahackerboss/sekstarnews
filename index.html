<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekstar News</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <!-- === HEADER === -->
    <header class="navbar">
        <button id="back-button" class="nav-button hidden"></button>
        <div class="nav-title">
            <img src="images/04a2de9d503f501aca1e.svg" style="height:1em; vertical-align: -8px;">
            SEKSTAR NEWS
        </div>
    </header>

    <!-- === MAIN APP CONTAINER === -->
    <main id="app-container">
        <!-- Widok Główny -->
        <div id="main-view">
            <div id="featured-slider-container"></div>
            <div id="articles-column">
                <div id="news-list-view"></div>
                <button id="load-more-articles-btn" class="load-more-btn hidden">Wczytaj więcej artykułów</button>
            </div>
        </div>

        <!-- Widok Artykułu -->
        <div id="article-view" class="hidden">
            <div id="article-content-wrapper">
                <div class="article-meta">
                    <span id="article-date"></span> | <span id="article-author"></span>
                </div>
                <div id="article-content"></div>
            </div>

            <div class="article-actions">
                <button id="like-button" class="action-button">
                    <span class="heart-icon">♡</span> Polub (<span id="like-count">0</span>)
                </button>
                <button id="share-button" class="action-button">
                    <img src="images/288ad794778de2e73599.svg" style="height: 1em; vertical-align: -3px;">Udostępnij
                </button>
            </div>

            <div class="comments-section">
                <h3>Komentarze</h3>
                <form id="comment-form">
                    <input type="text" id="comment-name" placeholder="Twój nick" required="">
                    <div class="format-buttons">
                        <button type="button" id="format-italic-btn"><i>I</i></button>
                    </div>
                    <textarea id="comment-message" placeholder="Twoja wiadomość..." required=""></textarea>
                    <button type="submit">Dodaj komentarz</button>
                </form>
                <div id="comments-list"></div>
                <button id="load-more-comments-btn" class="load-more-btn hidden">Wczytaj więcej komentarzy</button>
            </div>
        </div>
    </main>

    <!-- === MODALE I PANELE (POZA MAIN!) === -->

    <!-- 1. Panel Użytkownika -->
    <button id="user-panel-button">?</button>

    <div id="user-panel-view" class="hidden">
        <div id="user-panel-box">
            
            <!-- Zalogowany -->
            <div id="user-info-view" class="hidden">
                <h3>Witaj, <span id="user-info-nick"></span>!</h3>
                
                <div class="profile-tabs">
                    <button id="show-info-tab" class="active">Informacje ogólne</button>
                    <button id="show-perms-tab">Uprawnienia</button>
                </div>

                <div class="profile-content">
                    <!-- Zakładka Info -->
                    <div id="profile-info-content">
                        <form id="profile-info-form">
                            <label for="profile-nick-input">Twój Nick:</label>
                            <input type="text" id="profile-nick-input" required>

                            <label for="profile-color-input">Twój Kolor Nicku:</label>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <input type="color" id="profile-color-input" value="#ffffff">
                                <span style="font-size: 12px; color: #aaa;">(Widoczny w komentarzach)</span>
                            </div>

                            <label for="profile-email-input">Twój Email:</label>
                            <input type="email" id="profile-email-input" disabled>
                            
                            <label>Twoja Ranga:</label>
                            <div id="user-current-role-badge" style="color: #ffdd4b; font-weight: bold; margin-bottom: 15px;">Wczytywanie...</div>

                            <button type="button" id="profile-reset-password-button">Zresetuj hasło (otrzymasz email)</button>
                            <button type="submit" id="profile-save-button">Zapisz zmiany</button>
                        </form>
                    </div>

                    <!-- Zakładka Uprawnienia (Admin) -->
                    <div id="profile-perms-content" class="hidden">
                    <h4>Zarządzanie Użytkownikami</h4>
                    <div class="admin-panel-section">
    <!-- ZMIANA: Od razu wpisujemy właściwy tekst -->
                      <label for="admin-user-email">Zmień rangę użytkownika (wpisz NICK):</label>
                      <input type="text" id="admin-user-email" placeholder="Wpisz dokładny nick użytkownika">
                      <select id="admin-role-select"></select>
                      <button id="admin-assign-role-btn">Nadaj Rangę</button>
                    </div>
                        <hr style="border-color: #4a68a5; margin: 20px 0;">
                        <h4>Edytor Rang</h4>
                        <div class="admin-panel-section">
                            <label>Nazwa Rangi (ID):</label>
                            <input type="text" id="role-editor-name" placeholder="np. moderator">
                            <div class="checkbox-group">
                                <label><input type="checkbox" id="perm-write-articles"> Pisanie/Edycja Artykułów</label>
                                <label><input type="checkbox" id="perm-delete-comments"> Usuwanie Komentarzy</label>
                                <label><input type="checkbox" id="perm-manage-roles"> Zarządzanie Rolami</label>
                            </div>
                            <button id="admin-save-role-btn">Zapisz/Aktualizuj Rangę</button>
                        </div>
                    </div>
                </div>

                <hr style="border-color: #4a68a5; margin: 20px 0;">
                <button id="user-panel-logout">Wyloguj</button>
                <button id="user-panel-cancel">Zamknij</button>
            </div>

            <!-- Niezalogowany -->
            <div id="auth-view">
                <div class="auth-tabs">
                    <button id="show-login-tab" class="active">Logowanie</button>
                    <button id="show-register-tab">Rejestracja</button>
                </div>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Hasło" required>
                    <button type="submit">Zaloguj</button>
                </form>
                <form id="register-form" class="hidden">
                    <input type="text" id="register-nick" placeholder="Nick" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Hasło" required>
                    <button type="submit">Zarejestruj</button>
                </form>
                <button id="auth-cancel-button">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- 2. Panel Edytora -->
<div id="editor-view" class="hidden">
        <form id="editor-form">
            <h2>Edytor Artykułów</h2>
            <div class="editor-grid">
                <input type="hidden" id="editor-article-id"> 
                
                <div>
                    <label>ID:</label>
                    <input type="number" id="editor-id" required style="width: 100%;">
                </div>
                <div>
                    <label>Order:</label>
                    <input type="number" id="editor-order" required style="width: 100%;">
                </div>
                
                <div class="editor-full-width">
                    <label>Tytuł:</label>
                    <input type="text" id="editor-title" required style="width: 100%;">
                </div>

                <div>
                    <label>Autor:</label>
                    <input type="text" id="editor-author" required style="width: 100%;">
                </div>
                <div>
                    <label>Data:</label>
                    <input type="text" id="editor-date" required style="width: 100%;">
                </div>

                <div class="editor-full-width">
                    <label>URL Miniaturki:</label>
                    <input type="text" id="editor-thumbnail" required style="width: 100%;">
                </div>

                <div class="editor-full-width">
                     <label><input type="checkbox" id="editor-featured"> Wyróżniony na sliderze?</label>
                </div>

                <div class="editor-full-width">
                    <label>Treść (HTML):</label>
                    <textarea id="editor-content" rows="15" required style="width: 100%;"></textarea>
                </div>
            </div>

            <div class="editor-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="editor-delete" class="delete-button" style="background-color: #d9534f; margin-right: auto;">USUŃ</button>
                <button type="button" id="editor-cancel">Anuluj</button>
                <button type="submit" style="background-color: #28a745;">Zapisz</button>
            </div>
        </form>
    </div>

    <!-- 3. FAB (Przycisk edycji) -->
    <div id="fab-edit-article" class="fab-button hidden" title="Edytuj ten artykuł">✎</div>

    <!-- === SKRYPTY === -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="script.js"></script>

    <!-- === FOOTER (CAŁKOWICIE NA DOLE) === -->
    <footer style="text-align: center; padding: 20px; font-size: 12px; color: #aaa; border-top: 1px solid #4a68a5; margin-top: 30px;">
        This site is protected by reCAPTCHA and the Google
        <a href="https://policies.google.com/privacy">Privacy Policy</a> and
        <a href="https://policies.google.com/terms">Terms of Service</a> apply.
        <div style="text-align: center; padding: 10px;">
            <button id="clear-cache-btn">Wyczyść pamięć podręczną artykułów</button>
        </div>
    </footer>

</body>
</html>
